# Hosted control plane (cp.ushr.io). Always-on: agents hold long-polls, so the
# machine must not scale to zero. Colocated with Neon in iad.
app = "ushr-cp"
primary_region = "iad"
# Deploy from the repo root so the build context includes go.mod:
#   fly deploy --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile

[env]
  USHR_LISTEN = "0.0.0.0:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
